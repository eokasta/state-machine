[project]
name = "state-machine"
version = "0.1.0"
description = "A Python state machine framework."
readme = "README.md"
authors = [
    { name = "Lucas Monteiro" }
]
requires-python = ">=3.12"
dependencies = [
    "sqlalchemy>=2.0,<3.0",
]

[build-system]
requires = ["uv_build>=0.12.5,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "mypy>=2.3.1",
    "pytest>=8.3.0",
    "ruff>=0.16.6",
]

[tool.ruff]
target-version = "py312"
line-length = 88

[tool.ruff.lint]
select = [
    "A",
    "ANN",
    "ARG",
    "B",
    "C4",
    "DTZ",
    "E",
    "F",
    "I",
    "ISC",
    "N",
    "PIE",
    "PL",
    "PTH",
    "RET",
    "RSE",
    "RUF",
    "SIM",
    "TCH",
    "UP",
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"

[tool.mypy]
python_version = "3.12"
files = ["src"]
strict = true
warn_unreachable = true
